# Care-level rules. Simplified, not clinically validated. Prototype only.
#
# Rules are checked top to bottom; the first match wins (D-001).
# when (all optional, all must hold):
#   category            Jev symptom category, one of lexicon categories
#   min_urgency / max_urgency       Jev urgency score 1-5
#   min_severity / max_severity     self-reported severity 1-10
#   min_duration_hours  needs a stated duration; unknown duration never matches (D-025)
#   symptom_any         any of these words in the parsed main symptom
#   slots_any           {slot: [values]}: any listed slot answer (question bank) holds (D-041)
# needs        slots this rule must know before it decides; the pipeline asks for a missing one
#              (question budget permitting), otherwise the decision escalates one level (D-041)
# level        care level when something at that level is open
# after_hours  where to go when nothing at `level` is open now (never SELF_CARE);
#              time of day is handled here and by the opening-hours check (D-026)
# reason       plain-English "because ..." used by the explanation (no diagnosis, no level names)
# note         shown with the decision
version: "2.0"
label: "Simplified, not clinically validated"

rules:
  - id: R-01
    description: Highest urgency score
    when: {min_urgency: 5}
    level: ER
    after_hours: ER
    reason: "the symptoms you described sound like they need care right away"

  - id: R-02
    description: Very high self-reported severity without a red flag
    when: {min_severity: 8}
    level: URGENT_CARE
    after_hours: ER
    reason: "you rated how bad it feels as very high"
    note: "If it gets worse or you feel faint, call 911."

  - id: R-03
    description: Ongoing condition, refills and check-ups
    when: {category: [chronic]}
    level: PRIMARY_CARE
    after_hours: TELEHEALTH
    reason: "ongoing conditions and refills are best handled by a regular clinician"

  - id: R-04
    description: Stress, sleep or mood without crisis wording (crisis wording routes to 988 earlier)
    when: {category: [mental_health]}
    level: PRIMARY_CARE
    after_hours: TELEHEALTH
    reason: "stress and sleep problems are best followed up by a regular clinician"
    note: "If thoughts of harming yourself come up, call or text 988 any time."

  - id: R-05
    description: Long-standing problem, two weeks or more
    when: {min_duration_hours: 336}
    level: PRIMARY_CARE
    after_hours: TELEHEALTH
    reason: "a problem lasting two weeks or more is best checked by a regular clinician"

  - id: R-06
    description: Mild seasonal allergy symptoms
    when: {category: [allergy], max_urgency: 2}
    level: SELF_CARE
    after_hours: TELEHEALTH
    reason: "mild seasonal allergy symptoms can usually be managed at home"
    note: "Call your plan's nurse line if symptoms get worse or you are unsure."

  - id: R-07
    description: Mild headache
    when: {category: [neuro], max_urgency: 2, max_severity: 4}
    level: SELF_CARE
    after_hours: TELEHEALTH
    reason: "a mild headache can usually be managed at home"
    note: "Call your plan's nurse line if it gets worse; a sudden, severe headache needs 911."

  - id: R-08
    description: Stomach symptoms with vomiting or diarrhea
    when: {category: [gastrointestinal], min_urgency: 3}
    level: URGENT_CARE
    after_hours: TELEHEALTH
    reason: "vomiting or diarrhea usually needs a same-day check"
    note: "If you can't keep fluids down or feel dizzy when standing, go to the ER."

  - id: R-21
    description: Vomiting named in the symptoms, whatever the urgency score (D-036)
    when: {symptom_any: [vomit]}
    level: URGENT_CARE
    after_hours: TELEHEALTH
    reason: "vomiting usually needs a same-day check"
    note: "If you can't keep fluids down or feel dizzy when standing, go to the ER."

  - id: R-09
    description: Milder stomach symptoms
    when: {category: [gastrointestinal]}
    level: TELEHEALTH
    after_hours: TELEHEALTH
    reason: "milder stomach symptoms can usually be assessed by video"
    note: "If you can't keep fluids down or feel dizzy when standing, go to the ER."

  - id: R-10
    description: Acute injury that may need an exam or X-ray
    when: {category: [musculoskeletal], min_urgency: 3}
    level: URGENT_CARE
    after_hours: ER
    reason: "an injury like this may need an in-person exam or X-ray"

  - id: R-24
    description: Injury with swelling or a limb that can't be used (D-041)
    when: {category: [musculoskeletal], slots_any: {swelling_or_deformity: ["yes"], can_use_or_bear_weight: ["no"]}}
    level: URGENT_CARE
    after_hours: ER
    reason: "swelling or not being able to use it may need an in-person exam or X-ray"

  - id: R-11
    description: Minor strain or ache
    when: {category: [musculoskeletal]}
    needs: [injury_mechanism, swelling_or_deformity, can_use_or_bear_weight]
    level: PRIMARY_CARE
    after_hours: TELEHEALTH
    reason: "a minor strain is best checked at a regular appointment"

  - id: R-22
    description: Tick or insect bite, whatever the category (D-036)
    when: {symptom_any: [tick bite, insect bite, bug bite, mosquito bite]}
    level: TELEHEALTH
    after_hours: TELEHEALTH
    reason: "a tick or insect bite can usually be reviewed by video"
    note: "If a spreading rash, fever or swelling appears, get seen in person."

  - id: R-12
    description: Cuts, bites, burns and splinters
    when: {category: [wound]}
    level: URGENT_CARE
    after_hours: TELEHEALTH
    reason: "cuts, bites and burns are best checked in person the same day"
    note: "If bleeding won't stop with pressure, go to the ER."

  - id: R-13
    description: Burning or pain when urinating
    when: {category: [urinary]}
    level: URGENT_CARE
    after_hours: TELEHEALTH
    reason: "urinary symptoms usually need a same-day check"

  - id: R-14
    description: Tooth or gum pain
    when: {category: [dental]}
    level: URGENT_CARE
    after_hours: TELEHEALTH
    reason: "tooth or gum pain is best seen the same day"
    note: "If your face or neck swells quickly or swallowing gets hard, go to the ER."

  - id: R-15
    description: Eye irritation
    when: {category: [eye]}
    level: TELEHEALTH
    after_hours: TELEHEALTH
    reason: "eye irritation can usually be assessed by video"

  - id: R-16
    description: Hives
    when: {category: [skin], symptom_any: [hives]}
    level: URGENT_CARE
    after_hours: TELEHEALTH
    reason: "hives are best checked the same day"
    note: "If your lips, tongue or throat swell or breathing changes, call 911."

  - id: R-17
    description: Rash or other skin problem
    when: {category: [skin]}
    level: TELEHEALTH
    after_hours: TELEHEALTH
    reason: "most rashes can be assessed by video"

  - id: R-18
    description: Ear, throat or fever symptoms
    when: {category: [ent, fever]}
    level: URGENT_CARE
    after_hours: TELEHEALTH
    reason: "ear, throat and fever symptoms usually need a same-day check"

  - id: R-23
    description: Sore throat, ear pain or fever named in the symptoms, whatever the category (D-036)
    when: {symptom_any: [sore throat, ear pain, earache, fever]}
    level: URGENT_CARE
    after_hours: TELEHEALTH
    reason: "ear, throat and fever symptoms usually need a same-day check"

  - id: R-25
    description: Breathlessness with activity only (at rest is a danger answer before this) (D-041)
    when: {symptom_any: [short of breath, shortness of breath, out of breath, breathless]}
    level: PRIMARY_CARE
    after_hours: TELEHEALTH
    reason: "breathlessness with activity is best checked by a regular clinician"
    note: "If you become short of breath at rest, call 911."

  - id: R-19
    description: Cold and nose symptoms
    when: {category: [respiratory]}
    level: TELEHEALTH
    after_hours: TELEHEALTH
    reason: "cold and nose symptoms can usually be assessed by video"

  - id: R-20
    description: Anything not matched above (fail toward more care)
    level: URGENT_CARE
    after_hours: TELEHEALTH
    reason: "when symptoms don't fit a clear pattern, we point you to more care rather than less"
