# Red flags in three tiers (D-041). Simplified, not clinically validated. Prototype only.
#
# Tier 1 (categories): unmistakable signs. Any hit -> EMERGENCY immediately, no questions.
#   Each category has an action: CALL_911 or GO_TO_ER; CALL_911 wins when both hit (D-048).
#   symptom_guide.json danger_signs must give the same action for the same sign
#   (tests/test_safety_consistency.py).
# Tier 2 (tier2): a single weak signal. Ask the mapped safety question first; a danger answer
#   -> EMERGENCY, otherwise routing continues.
# Tier 3: neither. Normal clarification and routing.
#
# Matching runs on normalized text (lowercase, apostrophes removed, punctuation -> spaces).
# phrases: matched word by word; a word may differ by a typo (config.FUZZY_*), short words exactly.
# patterns: each entry is a list of regexes that must ALL match.
# A match is ignored when a negation cue appears up to 3 words before it in the same clause
# ("no chest pain"); commas, full stops and "but" end a clause.
version: "2.2"
label: "Simplified, not clinically validated"

messages:
  "911": "Call 911 or go to the nearest ER."
  "GO_TO_ER": "Go to the nearest ER now and have someone else drive. Call 911 if it gets worse."
  "988": "Call or text 988 (Suicide & Crisis Lifeline) now, or call 911 if you are in immediate danger."

# Quoted: an unquoted `no` is the boolean false in YAML 1.1.
negation_cues: ["no", "not", "without", "never", "denies", "deny", "none", "nor", "dont", "didnt", "doesnt", "isnt", "wasnt"]
clause_breaks: ["but", "however", "though", "although"]

categories:
  cardiac:
    resources: ["911"]
    action: CALL_911
    phrases:
      - chest pain
      - pain in my chest
      - chest tightness
      - tight chest
      - chest pressure
      - pressure in my chest
      - crushing chest
      - squeezing chest
      - heart attack
      - nearly passed out
      - almost passed out
      - nearly fainted
    patterns:
      - ['\bchest\b', '\b(tight\w*|pressure|heavy|heaviness|squeez\w*|crush\w*|elephant|sitting on)\b']
  breathing:
    resources: ["911"]
    action: CALL_911
    phrases:
      - cant breathe
      - cannot breathe
      - not breathing
      - difficulty breathing
      - trouble breathing
      - struggling to breathe
      - cant catch my breath
      - gasping for air
      - lips turning blue
      - lips are blue
      - turning blue
    patterns:
      - ['\bbreath\w*', '\b(struggl\w*|even (sitting|resting|lying|at rest)|sitting still)\b']
      - ['\b(short of breath|shortness of breath)\b', '\bchest (pain|tight\w*|pressure)\b']
  stroke:
    resources: ["911"]
    action: CALL_911
    phrases:
      - face is drooping
      - face drooping
      - drooping on one side
      - slurred speech
      - slurring my words
      - sudden weakness
      - numb on one side
      - worst headache of my life
      - worst headache ever
    patterns:
      - ['\bsudden\w*', '\b(cant see|lost (my )?vision|vision loss|blind\w*)\b']
      - ['\bconfus\w*', '\b(cant lift|weak\w*|numb\w*|droop\w*|slurr\w*)\b']
      - ['\bcant (lift|move) (my |his |her |their )?(right |left )?(arm|leg)\b']
      - ['\bheadache\b', '\bworst\b.{0,30}\b(life|ever)\b']
  bleeding:
    resources: ["911"]
    action: CALL_911
    phrases:
      - bleeding that wont stop
      - wont stop bleeding
      - cant stop the bleeding
      - vomiting blood
      - throwing up blood
      - coughing up blood
      - blood is spurting
      - spurting blood
      - bleeding heavily
      - heavy bleeding
    patterns:
      - ['\b(black tarry|tarry stool|bloody stool|black stool)\b', '\b(faint\w*|passed out|dizz\w*)\b']
  gi_bleeding:
    resources: ["911"]
    action: GO_TO_ER
    phrases:
      - black tarry stool
      - tarry stool
      - bloody stool
      - black stool
  allergic_reaction:
    resources: ["911"]
    action: CALL_911
    phrases:
      - throat is swelling
      - throat swelling
      - throat is closing
      - tongue swelling
      - tongue is swelling
      - anaphylaxis
    patterns:
      - ['\b(lips|tongue|throat)\b', '\bswell\w*']
  mental_health_crisis:
    resources: ["988", "911"]
    action: CALL_911
    phrases:
      - end my life
      - kill myself
      - killing myself
      - suicide
      - suicidal
      - want to die
      - hurt myself
  severe_dehydration:
    resources: ["911"]
    action: GO_TO_ER
    phrases:
      - cant keep any water down
      - cant keep water down
      - cant keep fluids down
      - cant keep anything down
      - unable to keep fluids down
      - unable to keep any fluids down
    patterns:
      - ['\b(havent peed|no urine|not peeing)\b', '\b(vomit\w*|dizz\w*)\b']
  # Can't keep fluids down is GO_TO_ER; with confusion, fainting, extreme sleepiness or blood it is CALL_911.
  dehydration_serious:
    resources: ["911"]
    action: CALL_911
    patterns:
      - ['\b(cant|cannot|unable to) keep (any |anything )?\w* ?down\b', '\b(confus\w*|faint\w*|passed out|extremely sleepy|very sleepy|hard to wake|blood\w*)\b']
  infant_fever:
    resources: ["911"]
    action: GO_TO_ER
    patterns:
      - ['\b(newborn|\d+ (day|days|week|weeks) old|[0-2] (month|months) old|one month old|two months old)\b', '\bfever\b']
  neuro:
    resources: ["911"]
    action: CALL_911
    phrases:
      - seizure
      - convulsion
      - passed out
      - unconscious
      - unresponsive
      - not waking up
      - isnt waking up
  head_injury:
    resources: ["911"]
    action: CALL_911
    patterns:
      - ['\b(hit|bumped|banged|hurt) (my |his |her |their )?head\b', '\b(vomit\w*|throwing up|sleepy|drowsy|confused|passed out)\b']
  poisoning:
    resources: ["911"]
    action: CALL_911
    phrases:
      - too many pills
      - overdose
      - button battery
      - swallowed a battery
      - swallowed bleach
      - poisoned
  pregnancy:
    resources: ["911"]
    action: GO_TO_ER
    patterns:
      - ['\bpregnant\b', '\bbleed\w*']
  trauma:
    resources: ["911"]
    action: GO_TO_ER
    phrases:
      - bone sticking out
      - bone is sticking out
      - clearly broken
  trauma_crash:
    resources: ["911"]
    action: CALL_911
    patterns:
      - ['\b(car crash|car accident|hit by a car|fell from)\b', '\b(neck|back|head|tingl\w*|numb\w*)\b']
  abdominal:
    resources: ["911"]
    action: GO_TO_ER
    phrases:
      - belly is hard
      - stomach is rigid
    patterns:
      - ['\b(severe|worst)\b', '\b(stomach|belly|abdomen)\b', '\b(hard|rigid|cant stand)\b']
      - ['\blower right\b', '\b(fever|worse|worsening)\b']
  infection:
    resources: ["911"]
    action: GO_TO_ER
    patterns:
      - ['\bstiff neck\b', '\bfever\b']
  infection_serious:
    resources: ["911"]
    action: CALL_911
    patterns:
      - ['\b(fever|stiff neck)\b', '\brash\b', '\b(doesnt|does not|wont|will not|not) fade\b']
      - ['\bfever\b', '\b(confus\w*|very hard to wake|hard to wake)\b']

# Tier 2: one weak signal -> ask the safety question first (any pattern may match).
# suppressed_by_injury: an injury or benign cause in the text ("lifted boxes", "after my flu shot")
# points to the injury rules instead.
tier2:
  arm_jaw_back_pain:
    safety_slot: associated_cardiac_symptoms
    suppressed_by_injury: true
    patterns:
      - '\b(arm|jaw|back|shoulder)s? (pain|hurts?|aches?|aching|is sore|is hurting)\b'
      - '\b(pain|ache|aching|soreness) in (my |his |her )?(left |right )?(arm|jaw|back|shoulder)\b'
      - '\bsore (left |right )?(arm|jaw|back|shoulder)\b'
  short_of_breath:
    safety_slot: breathing_at_rest
    suppressed_by_injury: false
    patterns:
      - '\b(short of breath|shortness of breath|out of breath|breathless|winded)\b'
  headache:
    safety_slot: headache_onset
    suppressed_by_injury: false
    patterns:
      - '\b(headache|migraine|head hurts|head is pounding|head pain)\b'
  abdominal_pain:
    safety_slot: abdominal_location_and_trend
    suppressed_by_injury: false
    patterns:
      - '\b(stomach|belly|abdominal|abdomen|tummy) (pain|ache|hurts)\b'
      - '\bstomach ?ache\b'
      - '\bpain in (my |his |her )?(stomach|belly|abdomen|tummy)\b'
  dizziness:
    safety_slot: associated_cardiac_symptoms
    suppressed_by_injury: false
    patterns:
      - '\b(dizzy|dizziness|lightheaded|light headed|woozy)\b'
  vomiting:
    safety_slot: fluids_kept_down
    suppressed_by_injury: false
    patterns:
      - '\b(vomit\w*|throwing up|threw up|puking|puked)\b'
  child_fever:
    safety_slot: child_age
    suppressed_by_injury: false
    needs_child: true
    patterns:
      - '\bfevers?\b'

# Child context for child_fever (or the request's age group is "child").
child_context:
  - '\b(kid|kids|child|son|daughter|baby|toddler|infant|newborn)\b'
  - '\b\d+ (year|month|week|day)s? old\b'

# Injury or benign-cause context: points to injury rules unless a Tier 1 sign is present.
injury_context:
  - '\b(played|fell|fallen|tripped|twisted|sprained|lifted|lifting|carried|carrying|bumped)\b'
  - '\bmoving (furniture|boxes|house)\b'
  - '\b(volleyball|soccer|basketball|football|tennis|bench press|weightlifting|skating|skiing|hiking|hike|workout)\b'
  - '\b(after|during|from) (my |a |the )?(run|running|jog|jogging|exercise|exercising|working out|gym|practice|game|match|yoga|flu shot|shot|vaccine|vaccination|injection|dentist)\b'
